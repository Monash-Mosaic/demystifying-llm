services:
  web:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: prompt-editor-web

    command: >
      uvicorn config.asgi:application
      --host 0.0.0.0
      --port 8000
      --reload

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      POSTGRES_HOST: db

    volumes:
      - .:/app

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

  db:
    image: postgres:17-alpine

    container_name: prompt-editor-db

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

volumes:
  postgres_data:
