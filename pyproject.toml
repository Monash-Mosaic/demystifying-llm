[tool.ruff]
target-version = "py312"
line-length = 88

extend-exclude = [
    ".venv",
    "staticfiles",
    "migrations",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"